name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore update signing key when configured
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$UPDATE_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$UPDATE_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            echo "UPDATE_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          fi
      - name: Check playback logic
        run: bash scripts/test.sh
      - name: Build and lint
        run: bash gradlew assembleDebug lintDebug --no-daemon --no-build-cache
      - name: Verify persistent signature when configured
        run: |
          if [ -n "$UPDATE_KEYSTORE_PATH" ]; then python3 scripts/verify_signing.py; fi
      - uses: actions/upload-artifact@v4
        with:
          name: big-phone-player-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
