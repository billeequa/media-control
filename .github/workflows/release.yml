name: Publish APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore stable signing key
        env:
          UPDATE_KEY: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$UPDATE_KEY" ]; then
            echo 'Configure ANDROID_DEBUG_KEYSTORE_BASE64 before publishing. See docs/RELEASING.md.'
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$UPDATE_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Test, build and lint
        run: |
          bash scripts/test.sh
          bash gradlew assembleDebug lintDebug --no-daemon
      - name: Publish versioned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" app/build.gradle)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then exit 1; fi
          tag="v$version"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo 'This version already has a release. Bump versionCode and versionName first.'
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk big-phone-player.apk
          gh release create "$tag" big-phone-player.apk --target "$GITHUB_SHA" --title "Big Phone Player $version" --generate-notes --latest
